global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # POS Core Microservices (via Docker service discovery)
  - job_name: pos-auth-service
    static_configs:
      - targets: ['auth-service:5001']
    metrics_path: /metrics

  - job_name: pos-inventory-service
    static_configs:
      - targets: ['inventory-service:5002']
    metrics_path: /metrics

  - job_name: pos-order-service
    static_configs:
      - targets: ['order-service:5003']
    metrics_path: /metrics

  # Nginx API Gateway
  - job_name: pos-api-gateway
    static_configs:
      - targets: ['api-gateway:9113']
    metrics_path: /metrics

# Alerting rules
rule_files:
  - /etc/prometheus/alerts/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
